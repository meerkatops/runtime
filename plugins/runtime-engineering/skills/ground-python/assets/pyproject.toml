[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "name"
version = "0.1.0"
description = "One line saying what it does."
requires-python = ">=3.14"  # an example: set it to the newest stable Python every dependency supports (references/start.md)
dependencies = []

[project.scripts]
name = "name.cli:main"

# The tools the coding-rulebook's Python tool gate runs, pinned: `pip install -e . --group dev`.
[dependency-groups]
dev = ["ruff==0.17.4", "pyright==1.1.414", "pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/name"]

# Added to ruff's default rule set: the rule families the coding-rulebook's Python rules name.
[tool.ruff.lint]
extend-select = ["ANN", "ASYNC", "B", "BLE", "NPY", "PLW", "RUF", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest tests assert

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest]
testpaths = ["tests"]
